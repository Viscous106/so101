[project]
name = "so101-lab"
version = "0.1.0"
description = "SO-101 / LeRobot playground: MuJoCo sim + real hardware calibration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy<2.3",
    "imageio[ffmpeg]",
    "matplotlib",
]

[project.optional-dependencies]
sim = [
    "mujoco>=3.2",
]
real = [
    "lerobot[feetech,hardware,placo-dep]>=0.6.1",
    "opencv-python-headless",
    "python-xlib",
]
genesis = [
    "genesis-world>=1.4.1",
]

[tool.uv]
package = false
